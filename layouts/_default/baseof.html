<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Page.Title }} - Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        main {
            padding: 40px;
        }
        section {
            margin-bottom: 40px;
        }
        h2 {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        .bio {
            font-size: 1.1em;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .projects {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .project-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }
        .project-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        .project-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        .project-card p {
            margin-bottom: 10px;
            color: #666;
        }
        .meta {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 10px;
        }
        .tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .tag {
            background: #667eea;
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }
        .skills {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .skill-group h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        .skill-group ul {
            list-style: none;
            padding-left: 0;
        }
        .skill-group li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .status {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            color: #2e7d32;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #f0f0f0;
            color: #666;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Your Professional Portfolio</h1>
            <p>Resume • Personal Projects • Work Achievements</p>
        </header>
        
        <main>
            {{ .Content }}
        </main>
        
        <footer>
            <p>🚀 Built with HugoBlox | Ready to deploy to GitHub Pages</p>
            <p style="margin-top: 10px; font-size: 0.9em;">See GITHUB_PAGES_DEPLOY.md for deployment instructions</p>
        </footer>
    </div>
</body>
</html>
