{{ define "main" }}

{{ partial "components/cover.html" . }}

<div class="mx-auto max-w-screen-lg px-6 pt-4 pb-12">
  <article class="prose prose-slate lg:prose-xl dark:prose-invert max-w-none">
    <h1 class="text-4xl font-bold tracking-tight text-slate-900 dark:text-slate-100">{{ .Title }}</h1>

    <div class="mt-4 mb-10 text-sm text-slate-500 dark:text-slate-300">
      {{ if .Date }}
        <span>{{ (.Date) | time.Format (site.Params.hugoblox.locale.date_format | default ":date_long") }}</span>
      {{ end }}
    </div>

    <div class="mb-8">
      {{ partial "page_links_div.html" . }}
    </div>

    {{ .Content }}
  </article>
</div>

{{ end }}
